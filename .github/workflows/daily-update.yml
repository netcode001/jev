name: daily-update

on:
  schedule:
    # single comma-separated entry: one list item, three runs a day.
    # (a multi-item list is what broke this file on 2026-09-22 — nesting a
    #  second `- cron:` under the first silences the whole workflow)
    - cron: '0 2,8,14 * * *'   # 北京时间 10:00 / 16:00 / 22:00
  workflow_dispatch: {}    # 手动触发入口

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest Jev news & pricing
        run: python update_news.py
        env:
          # 内置 token，让 GitHub topic:jev 信源不受匿名限流
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & push new data (triggers Cloudflare Pages rebuild)
        run: |
          git config user.name  "jev-bot"
          git config user.email "bot@jev-ai.live"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data today."
          else
            git commit -m "chore: daily Jev news update ($(date -u +%F))"
            git push
            # notify Bing/Yandex/Seznam (IndexNow) about ALL pages
            # (wait for the Cloudflare Pages rebuild to finish, then submit
            #  every sitemap URL in one batch — key file lives at site root)
            sleep 150
            URLS=$(curl -s https://jev-ai.live/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<loc>//;s|</loc>||' | awk '{printf "\"%s\",", $1}' | sed 's/,$//')
            curl -s -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "{\"host\":\"jev-ai.live\",\"key\":\"a3f8c2e91b7d4f6e8c5a2d7b9e4f1c38\",\"keyLocation\":\"https://jev-ai.live/a3f8c2e91b7d4f6e8c5a2d7b9e4f1c38.txt\",\"urlList\":[${URLS}]}" || true
          fi
